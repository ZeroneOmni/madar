<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        let appearance = "system";
        try {
          const stored = window.localStorage.getItem("madar:theme-appearance-mode");
          if (stored === "light" || stored === "dark") appearance = stored;
        } catch {}
        const dark =
          appearance === "dark" ||
          (appearance === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#0a0a0a" : "#ffffff");
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      html.dark body {
        background: #0a0a0a;
        color: #f5f5f5;
      }

      #boot-shell {
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
        color: inherit;
      }

      #boot-shell-card {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }

      #boot-error {
        display: grid;
        justify-items: center;
        gap: 16px;
        max-width: 600px;
        padding: 24px;
        text-align: center;
      }

      #boot-error p {
        margin: 0;
        overflow-wrap: anywhere;
      }

      #boot-error button {
        padding: 8px 16px;
        border: 1px solid currentColor;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
    <title>Madar (Beta)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Madar splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="Madar" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
