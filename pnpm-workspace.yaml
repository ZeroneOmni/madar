packages:
  - apps/*
  - infra/*
  - oxlint-plugin-madar
  - packages/*
  - scripts

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11+).
# true = allowed to run build scripts; false mirrors the pnpm 10 behavior
# where anything outside onlyBuiltDependencies was silently not built.
allowBuilds:
  bufferutil: false
  core-js: false
  # No install script since Electron 44; ensure:electron runs install.js.
  # Keep the key: pnpm fails installs that still record a removed `true`.
  electron: false
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: true
  msw: false
  sharp: true
  "@tsc-rs/typescript": true
  utf-8-validate: false
  workerd: false

catalog:
  "@effect/atom-react": 4.0.5
  "@effect/platform-node": 4.0.5
  "@effect/platform-node-shared": 4.0.5
  "@effect/vitest": 4.0.5
  "@noble/curves": 1.9.1
  "@noble/hashes": 1.8.0
  "@tailwindcss/node": 4.3.3
  "@tailwindcss/oxide": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.12.4
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  "@types/ws": 8.18.2
  effect: 4.0.5
  jose: 6.2.2
  lightningcss: 1.33.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: npm:@tsc-rs/typescript@0.8.0
  undici: 8.11.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  ws: 8.22.0
  yaml: ^2.9.0

minimumReleaseAgeExclude:
  - "@tsc-rs/*"
  - "@distilled.cloud/aws@1.0.0-rc.13"
  - "@distilled.cloud/axiom@1.0.0-rc.13"
  - "@distilled.cloud/cloudflare@1.0.0-rc.13"
  - "@distilled.cloud/core@1.0.0-rc.13"
  - "@distilled.cloud/neon@1.0.0-rc.13"
  - "@distilled.cloud/planetscale@1.0.0-rc.13"
  - "@effect/atom-react@4.0.5"
  - "@effect/platform-node-shared@4.0.5"
  - "@effect/platform-node@4.0.5"
  - "@effect/sql-pg@4.0.5"
  - "@effect/sql-sqlite-do@4.0.5"
  - "@effect/vitest@4.0.5"
  - alchemy@2.0.0-beta.80
  - effect@4.0.5
  - electron@44.9.3
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.80"
  - "@alchemy.run/floci@2.0.0-beta.80"
  - "@alchemy.run/node-utils@2.0.0-beta.80"
  - "@distilled.cloud/fly-io@1.0.0-rc.13"
  - "@distilled.cloud/hetzner@1.0.0-rc.13"
  - "@distilled.cloud/prisma@1.0.0-rc.13"
  - "@distilled.cloud/railway@1.0.0-rc.13"
  - "@distilled.cloud/stripe@1.0.0-rc.13"
  - "@shadcn/lint@0.1.5"
  - "react@19.3.0"
  - "react-dom@19.3.0"
  - "@distilled.cloud/acme@1.0.0-rc.13"
  - "@distilled.cloud/doppler@1.0.0-rc.13"
  - "@distilled.cloud/gcp@1.0.0-rc.13"
  - "@distilled.cloud/infisical@1.0.0-rc.13"
  - "@distilled.cloud/zerossl@1.0.0-rc.13"

overrides:
  # Pin every patched package, including transitive dependencies, so lockfile-free
  # release installs cannot drift past the patch. Update these with patchedDependencies.
  alchemy: 2.0.0-beta.80
  app-builder-lib: 26.16.1
  # Keep jsdom's optional peer consistent so Vite+ has one test-runner instance.
  "@exodus/bytes>@noble/hashes": "1.8.0"
  # Alchemy's Ink fork declares React as a hard dependency, but the task cache only
  # reaches its terminal-capability helpers; the TUI is never imported, so the
  # extra React copy is pure install weight.
  "@alchemy.run/sigil>react": "-"
  "@alchemy.run/sigil>react-reconciler": "-"
  "@alchemy.run/sigil>scheduler": "-"
  # Alchemy only reaches @prisma/dev through a lazy import inside the Prisma
  # database provider, which the task cache never deploys. Its exact hono/valibot
  # pins are also the bulk of our open dependency advisories.
  "alchemy>@prisma/dev": "-"
  "@effect/atom-react": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  # Keep one copy of these native-binary packages. lightningcss ships 11 platform binaries per
  # version, and the workspaces' tailwindcss ^4 ranges drift into two 4.3.x copies of the family.
  "@tailwindcss/node": "catalog:"
  "@tailwindcss/oxide": "catalog:"
  "@tailwindcss/vite": "catalog:"
  "@types/node": "catalog:"
  effect: "catalog:"
  node-abi: 4.33.0
  lightningcss: "catalog:"
  tailwindcss: "catalog:"
  # Ranges from @effect/platform-node, jsdom, build dependencies otherwise
  # settle on two patch releases of each major. Older majors stay as they are.
  "@types/ws@^8": "catalog:"
  "undici@^8": "catalog:"
  "ws@^8": "catalog:"
  vite: "catalog:"
  vite-plus: "catalog:"
  yaml: "catalog:"

packageExtensions:
  # Our patch makes @effect/vitest import vite-plus/test. A catalog: spec here
  # resolves through the vite-plus override above.
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"

patchedDependencies:
  alchemy@2.0.0-beta.80: patches/alchemy@2.0.0-beta.80.patch
  "@effect/vitest@4.0.5": patches/@effect__vitest@4.0.5.patch
  app-builder-lib@26.16.1: patches/app-builder-lib@26.16.1.patch

peerDependencyRules:
  allowAny:
    - typescript
    - vite
  allowedVersions:
    vite: "*"

# pnpm 12 links agent skills that dependencies ship into .claude/skills once
# approved. We curate our own skills, so deny these to keep installs quiet.
permissions:
  "@tanstack/router-plugin":
    skills: false
